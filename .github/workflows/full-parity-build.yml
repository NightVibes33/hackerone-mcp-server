name: Full parity build check
on:
  push:
    branches: [main, "full-*", "exact-*", "final-*"]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install
      - run: npm run build
      - run: npm run build:cli
