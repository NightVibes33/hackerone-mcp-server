name: Build

on:
  push:
    branches:
      - main
      - "full-*"
      - "exact-*"
      - "*final*"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Validate Hacker API contract
        run: npm run validate:hacker-api
      - name: Validate report search behavior
        run: npm run validate:search-reports
      - name: Build remote MCP
        run: npm run build
      - name: Build stdio MCP
        run: npm run build:cli
